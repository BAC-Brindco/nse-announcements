name: NSE Daily Announcements Report

on:
  # ── Morning: scrape + email report (10:00 IST = 04:30 UTC, Tue–Sat) ──────────
  # Primary trigger: cron-job.org fires workflow_dispatch at 04:30 UTC.
  # The three GHA schedules below are fallbacks only — _claim_slot() idempotency
  # prevents duplicate emails if more than one trigger fires.
  #
  # ── Evening: scrape only (4:30 PM IST = 11:00 UTC, Mon–Fri) ─────────────────
  # Captures the day's announcements so tomorrow morning's report is complete.
  # The report step exits cleanly (slot already claimed) on these evening runs.
  schedule:
    # Morning triggers (Tue–Sat — report covers previous trading day)
    - cron: "30 4 * * 2-6"   # 04:30 UTC = 10:00 IST — primary GHA fallback
    - cron: "00 5 * * 2-6"   # 05:00 UTC = 10:30 IST — 30-min fallback
    - cron: "30 5 * * 2-6"   # 05:30 UTC = 11:00 IST — 1-hour fallback
    # Evening triggers (Mon–Fri — scrape only, captures today's data)
    - cron: "00 11 * * 1-5"  # 11:00 UTC = 4:30 PM IST
    - cron: "30 11 * * 1-5"  # 11:30 UTC = 5:00 PM IST — 30-min fallback
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-report:
    name: "NSE announcements scrape & report"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape announcements, board meetings & corporate actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py

      - name: Send daily announcements report
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS:   ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SENDER_NAME:  ${{ vars.REPORT_SENDER_NAME || 'BAC Announcements' }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m reports.daily_announcements_report

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
