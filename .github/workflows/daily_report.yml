name: NSE Daily Announcements Report

# Runs once per morning at 08:00 IST, Mon–Sat. No re-checks — unlike the deals
# report, announcements do not arrive late for the previous session.
# Scrapes the latest data then sends the daily email report.
#
# Primary trigger: cron-job.org fires workflow_dispatch at 02:30 UTC (08:00 IST).
# The three GHA schedules below are fallbacks — _claim_slot() idempotency
# ensures only one email is sent even if multiple triggers fire close together.
#
# Every run emails a one-line operator log to parv.bangar@brindco.com only
# (reports/ops_log.py): sent, failed, or — Mondays and the day after a holiday,
# when the latest session was already reported — "not sent".
#
# Intraday data collection is handled separately by scrape.yml (5x per day).

on:
  schedule:
    - cron: "30 2 * * 1-6"   # 02:30 UTC = 08:00 IST — primary GHA fallback
    - cron: "00 3 * * 1-6"   # 03:00 UTC = 08:30 IST — 30-min fallback
    - cron: "30 3 * * 1-6"   # 03:30 UTC = 09:00 IST — 1-hour fallback
  workflow_dispatch:

concurrency:
  group: daily-announcements-report
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-report:
    name: "08:00 IST daily announcements report"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The PDF attachment is rendered by headless Chromium so that the CI
      # output matches a local preview exactly (same engine, same HTML).
      # Cached because the browser download is ~150 MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # continue-on-error on both: these produce the PDF *attachment*. The report
      # degrades gracefully without a PDF engine (build_attachments logs and
      # skips), so a browser download or apt hiccup must cost the attachment,
      # never the email.
      - name: Install Chromium for PDF rendering
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      # Liberation Serif is metrically identical to Times New Roman, which does
      # not exist on Linux — without it the PDF reflows against the local preview.
      - name: Install metric-compatible serif fonts
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends fonts-liberation

      # continue-on-error: scrape.yml already collects 5x per trading day, so the
      # data for this report is in Supabase before this step runs. If NSE 403s
      # here, main.py exits 1 and would take the whole job — and the email — with
      # it. A slightly staler report beats no report. (Same reasoning as the
      # deals pipeline's pre-report scrape step.)
      - name: Scrape announcements, board meetings & corporate actions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py

      - name: Send daily announcements report
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS:   ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_SENDER_NAME:  ${{ vars.REPORT_SENDER_NAME || 'BAC Announcements' }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m reports.daily_announcements_report

      # Python logs its own outcomes, including a report that raised. This covers
      # the job dying before Python could (checkout, pip, a missing secret).
      - name: Email operator log if the job failed
        if: failure()
        env:
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: >
          python3 -m reports.ops_log --if-not-sent --report "Daily Announcements"
          --status FAILED
          --headline "The daily announcements workflow failed before the report step could report. Nothing was sent to the desk from this run."
          --detail "Trigger: ${{ github.event_name }}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
