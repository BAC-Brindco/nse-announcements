# ─────────────────────────────────────────────────────────────────────────────
# Daily Announcements — body materiality filters
#
# These rules apply to the EMAIL BODY ONLY. The PDF and CSV attachments always
# carry the complete, unfiltered assembly — nothing configured here can hide a
# row from the attachments.
#
# Category strings are matched case-insensitively (NSE emits both "Credit
# Rating" and "Credit rating"), and `*_contains` lists match on substring so a
# new NSE variant ("Financial Results Updates") is picked up without an edit.
#
# Loader: reports/report_config.py — every key below has a dataclass default,
# so a missing key falls back rather than raising.
# ─────────────────────────────────────────────────────────────────────────────

# Which universes gate the body. Union of BAC coverage, Pillar I (NIFTY50/100)
# and NIFTY500 unless narrowed here.
universe:
  use_bac_coverage: true
  use_pillar1: true
  use_nifty500: true

# ─── i. Board Meetings ───────────────────────────────────────────────────────
board_meetings:
  horizon_days: 14
  # Rows rendered in the body. Overflow goes to the count line and the
  # attachment. Sized so an ordinary day never truncates.
  body_cap: 25
  # Kept for ANY symbol regardless of universe — these are material at any size.
  always_keep_purpose_contains: ["FUND RAIS", "DELIST"]
  # Dropped for non-coverage SME names when this is the only purpose on the row.
  drop_purpose_for_non_coverage_sme: ["Other business matters"]

# ─── ii. Event Calendar ──────────────────────────────────────────────────────
# Deliberately overlaps sessions 1-3 with the "Next 3 Sessions" panel: that
# panel is a compact at-a-glance table, this section carries company name and
# full agenda text. Progressive disclosure, not duplication.
event_calendar:
  horizon_sessions: 5
  body_cap: 30

# ─── iii. Corporate Actions ──────────────────────────────────────────────────
corporate_actions:
  horizon_days: 7
  body_cap: 20
  # For symbols OUTSIDE the body universe, keep only these action kinds
  # (classify_corp_action buckets). Plain small-cap dividends are dropped.
  non_universe_keep_kinds: ["rights", "bonus", "split", "buyback"]

# ─── iv. Key Announcements ───────────────────────────────────────────────────
key_announcements:
  # Exact category matches (case-insensitive).
  categories:
    - "Financial Results"
    - "Integrated Filing- Financial"
    - "Outcome of Board Meeting"
    - "Disclosure under SEBI Takeover Regulations"
    - "Acquisition"
    - "Amalgamation/Merger"
    - "Scheme of Arrangement"
    - "Allotment of Securities"
    - "Issue of Securities"
    - "Preferential issue"
    - "Buyback"
    - "Bagging/Receiving of orders/contracts"
    # Regulatory action against an issuer is material, so it belongs in iv —
    # but it must be listed explicitly. It used to arrive here by accident,
    # caught by the bare "order" substring below, and was then labelled as an
    # order win.
    - "Action(s) initiated or orders passed"
    - "Action(s) taken or orders passed"
  # Substring matches — catches NSE's variants without listing each one.
  category_contains:
    - "financial result"
    - "takeover"
    - "acquisition"
    - "merger"
    - "amalgamation"
    # "orders/contracts", not bare "order": the loose form also matched
    # "Action(s) initiated or orders passed" — SEBI enforcement, not an order win.
    - "orders/contracts"
    - "allotment"
  # Record dates are kept only for body-universe names (they are high-volume
  # and low-signal across the small-cap tail).
  record_date_categories: ["Record Date", "Record Date Updates"]
  record_date_universe_only: true
  # Drop rows whose entire summary restates "Outcome of Board Meeting held on X".
  drop_payload_free_outcomes: true
  body_cap: 40

# ─── v. Other Announcements ──────────────────────────────────────────────────
other_announcements:
  # Individual rows only for coverage names and substantive press releases;
  # everything else becomes the categorical count line.
  rows_for_coverage_only: true
  include_substantive_press_releases: true
  body_cap: 25

# ─── vi. Debt Market ─────────────────────────────────────────────────────────
debt_market:
  # Credit-rating actions are rendered for ANY issuer; other debt filings only
  # for body-universe issuers. The grouped-count footer covers the remainder.
  credit_rating_any_issuer: true
  credit_rating_category_contains: ["credit rating"]
  body_cap: 20

# ─── Multi-filing merge (applies to sections iv and v) ───────────────────────
merge:
  join: " · "
  summary_max_chars: 300

# ─── Forward panel ───────────────────────────────────────────────────────────
next_sessions:
  count: 3

# ─── Attachments ─────────────────────────────────────────────────────────────
attachments:
  pdf_enabled: true
  csv_enabled: true
  # Attachments are never filtered; this only guards against a pathological day
  # producing an unmailable file. 0 disables the guard.
  max_pdf_rows_per_section: 0
